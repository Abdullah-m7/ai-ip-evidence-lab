name: stage-001-ci

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evidence-gate tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test valid record
        run: python -m src.ipel.validator examples/records/valid.json
      - name: Confirm invalid record fails
        run: |
          if python -m src.ipel.validator examples/records/invalid_missing_source.json; then
            echo "Expected invalid record to fail the evidence gate"
            exit 1
          fi
