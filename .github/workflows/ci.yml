name: ipel-ci

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evidence-gate tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test valid record
        run: python -m src.ipel.validator examples/records/valid.json
      - name: Confirm invalid record fails
        run: |
          if python -m src.ipel.validator examples/records/invalid_missing_source.json; then
            echo "Expected invalid record to fail the evidence gate"
            exit 1
          fi
      - name: Reproduce Stage 003 semantic round-trip
        run: PYTHONPATH=. python experiments/stage003_semantic_roundtrip.py > /tmp/stage003-report.json
      - name: Confirm Stage 003 artifacts are deterministic
        run: git diff --exit-code -- examples/profiles reports/stage003_semantic_roundtrip.json

  stage004-c2pa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned c2patool
        run: ./scripts/install_c2patool.sh .tools/c2patool
      - name: Run real C2PA Stage 004 experiment
        run: PYTHONPATH=. python experiments/stage004_conformant_c2pa.py --c2patool .tools/c2patool --output reports/stage004_conformant_c2pa.json > /tmp/stage004-report.json
      - name: Confirm Stage 004 semantic report is reproducible
        run: git diff --exit-code -- reports/stage004_conformant_c2pa.json

  stage005-cross-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm Rust bootstrap is available
        run: rustup --version
      - name: Install pinned c2patool
        run: ./scripts/install_c2patool.sh .tools/c2patool
      - name: Build pinned cross-validator with disclosed compatibility repair
        run: ./scripts/install_c2pa_conformance_tool.sh .tools/c2pa-validate
      - name: Run Stage 005 cross-validator benchmark
        run: PYTHONPATH=. python experiments/stage005_cross_validator.py --c2patool .tools/c2patool --cross-validator .tools/c2pa-validate --output reports/stage005_cross_validator.json > /tmp/stage005-report.json
      - name: Confirm Stage 005 normalized report is reproducible
        run: git diff --exit-code -- reports/stage005_cross_validator.json

  stage006-reviewer-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Stage 006 blinded benchmark
        run: PYTHONPATH=. python experiments/stage006_build_benchmark.py > /tmp/stage006-build-report.json
      - name: Confirm Stage 006 artifacts are byte-reproducible
        run: git diff --exit-code -- benchmarks/stage006/generated
      - name: Run Stage 006 benchmark/scoring tests
        run: python -m unittest tests.test_reviewer_benchmark tests.test_stage006_artifacts -v

  stage007-adjudication-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Stage 007 adjudication preparation
        run: PYTHONPATH=. python experiments/stage007_build_preparation.py > /tmp/stage007-preparation.json
      - name: Rebuild Stage 007 power design grid
        run: PYTHONPATH=. python experiments/stage007_power_simulation.py > /tmp/stage007-power.json
      - name: Confirm Stage 007 artifacts are byte-reproducible
        run: git diff --exit-code -- benchmarks/stage007/generated
      - name: Validate Stage 007 pre-adjudication freeze
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.ipel.study_lock import validate_freeze_manifest
          root = Path('.').resolve()
          manifest = json.loads((root / 'benchmarks/stage007/generated/pre_adjudication_lock.json').read_text())
          validate_freeze_manifest(root, manifest)
          assert manifest['state'] == 'PRE_ADJUDICATION_LOCK'
          assert manifest['real_adjudication_collected'] is False
          assert manifest['final_sample_size_locked'] is False
          PY
      - name: Run Stage 007 adjudication/lock tests
        run: python -m unittest tests.test_stage007_adjudication tests.test_stage007_power_lock tests.test_stage007_prelock -v

  stage008-distribution-intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 008 distribution/intake tests
        run: python -m unittest tests.test_stage008_distribution -v
      - name: Export a TEST-ONLY per-distribution bundle
        env:
          IPEL_STAGE008_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
        run: |
          PYTHONPATH=. python scripts/export_adjudication_bundle.py \
            --distribution-id CI-TEST-001 \
            --output-dir .stage008-distributions/CI-TEST-001 \
            --private-dir .private-stage008/CI-TEST-001
          if grep -R -E 'ADJ-|OBJ-|JDG-|github\.com|Abdullah-m7' .stage008-distributions/CI-TEST-001; then
            echo "Forbidden internal/public-repository identifier leaked into distribution bundle"
            exit 1
          fi
      - name: Fill a synthetic returned-response file
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('.stage008-distributions/CI-TEST-001/response_template.json')
          d = json.loads(p.read_text())
          d['data_origin'] = 'SYNTHETIC_NON_HUMAN'
          d['synthetic_fixture'] = True
          d['adjudicator_id'] = 'SYNTHETIC-CI-ONLY'
          for row in d['responses']:
              row['decision'] = 'READY'
              row['confidence_0_to_100'] = 75
              row['rationale'] = 'Synthetic CI software test only.'
          Path('.stage008-distributions/CI-TEST-001/response.json').write_text(json.dumps(d, indent=2, sort_keys=True) + '\n')
          PY
      - name: Ingest synthetic response through explicit test lane
        env:
          IPEL_STAGE008_KEY_HEX: "1111111111111111111111111111111111111111111111111111111111111111"
        run: |
          PYTHONPATH=. python scripts/ingest_adjudication_responses.py \
            --bundle .stage008-distributions/CI-TEST-001/adjudication_bundle.json \
            --manifest .stage008-distributions/CI-TEST-001/bundle_manifest.json \
            --private-mapping .private-stage008/CI-TEST-001/private_case_mapping.json \
            --response .stage008-distributions/CI-TEST-001/response.json \
            --ledger .private-stage008/CI-TEST-001/intake_ledger.json \
            --allow-synthetic
      - name: Verify synthetic intake ledger and no repository mutation
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from src.ipel.adjudication_distribution import verify_intake_ledger
          p = Path('.private-stage008/CI-TEST-001/intake_ledger.json')
          ledger = json.loads(p.read_text())
          verify_intake_ledger(ledger)
          assert ledger['data_origin'] == 'SYNTHETIC_NON_HUMAN'
          assert len(ledger['responses']) == 24
          assert 'POST_ADJUDICATION_LOCK' not in json.dumps(ledger)
          PY
          git diff --exit-code
