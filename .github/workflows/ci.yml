name: ipel-ci

on:
  push:
    branches: [main, "stage/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run evidence-gate tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test valid record
        run: python -m src.ipel.validator examples/records/valid.json
      - name: Confirm invalid record fails
        run: |
          if python -m src.ipel.validator examples/records/invalid_missing_source.json; then
            echo "Expected invalid record to fail the evidence gate"
            exit 1
          fi
      - name: Reproduce Stage 003 semantic round-trip
        run: PYTHONPATH=. python experiments/stage003_semantic_roundtrip.py > /tmp/stage003-report.json
      - name: Confirm Stage 003 artifacts are deterministic
        run: git diff --exit-code -- examples/profiles reports/stage003_semantic_roundtrip.json

  stage004-c2pa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned c2patool
        run: ./scripts/install_c2patool.sh .tools/c2patool
      - name: Run real C2PA Stage 004 experiment
        run: PYTHONPATH=. python experiments/stage004_conformant_c2pa.py --c2patool .tools/c2patool --output reports/stage004_conformant_c2pa.json > /tmp/stage004-report.json
      - name: Confirm Stage 004 semantic report is reproducible
        run: git diff --exit-code -- reports/stage004_conformant_c2pa.json

  stage005-cross-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm Rust bootstrap is available
        run: rustup --version
      - name: Install pinned c2patool
        run: ./scripts/install_c2patool.sh .tools/c2patool
      - name: Build pinned cross-validator with disclosed compatibility repair
        run: ./scripts/install_c2pa_conformance_tool.sh .tools/c2pa-validate
      - name: Run Stage 005 cross-validator benchmark
        run: PYTHONPATH=. python experiments/stage005_cross_validator.py --c2patool .tools/c2patool --cross-validator .tools/c2pa-validate --output reports/stage005_cross_validator.json > /tmp/stage005-report.json
      - name: Confirm Stage 005 normalized report is reproducible
        run: git diff --exit-code -- reports/stage005_cross_validator.json

  stage006-reviewer-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild Stage 006 blinded benchmark
        run: PYTHONPATH=. python experiments/stage006_build_benchmark.py > /tmp/stage006-build-report.json
      - name: Confirm Stage 006 artifacts are byte-reproducible
        run: git diff --exit-code -- benchmarks/stage006/generated
      - name: Run Stage 006 benchmark/scoring tests
        run: python -m unittest tests.test_reviewer_benchmark tests.test_stage006_artifacts -v
